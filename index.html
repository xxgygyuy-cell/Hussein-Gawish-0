<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>С Днём Рождения, Зайкина</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--plum:#1b0a20;--wine:#3b1233;--rose:#f4a6c0;--blush:#ffd9e6;--gold:#e8c98a;--ink:#fff4f8;--soft:#ecd0dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--plum);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100svh;color:var(--ink);font:400 16px/1.6 Montserrat,system-ui,sans-serif;overflow-x:hidden;
background:radial-gradient(900px 600px at 50% -10%,var(--wine),transparent 70%),radial-gradient(700px 500px at 100% 100%,#4a1840,transparent 70%),var(--plum)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.serif{font-family:'Playfair Display',Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

#intro{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .9s,transform .9s}
#intro.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#intro p{margin:0;color:var(--soft);font-weight:300;letter-spacing:.04em}
#intro h2{margin:0;font-size:clamp(34px,9vw,56px);font-weight:600;letter-spacing:.12em;color:var(--gold)}
#gift{background:none;border:0;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:bob 2.4s ease-in-out infinite}
#gift svg{width:170px;height:170px;filter:drop-shadow(0 0 28px rgba(244,166,192,.45))}
#gift .lid{transform-box:fill-box;transform-origin:left bottom;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
#gift.open{animation:none}
#gift.open .lid{transform:translate(18px,-46px) rotate(24deg)}
#gift span{padding:12px 28px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);letter-spacing:.06em;transition:background .3s,color .3s}
#gift:hover span{background:var(--gold);color:var(--plum)}
@keyframes bob{50%{transform:translateY(-8px)}}
.from{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:14px}

#main{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:44px 22px 56px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1.4s}
#main.show{opacity:1;visibility:visible}
.hb{margin:0;color:var(--gold);font-weight:300;font-size:clamp(18px,4.6vw,24px);letter-spacing:.08em}
h1{margin:4px 0 26px;font-weight:500;font-style:italic;font-size:clamp(52px,16vw,104px);line-height:1.05;background:linear-gradient(100deg,var(--blush),var(--rose) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.frame{position:relative;width:min(78vw,340px);aspect-ratio:5/7;padding:9px;border-radius:200px 200px 22px 22px;border:1px solid var(--gold);box-shadow:0 0 0 6px rgba(232,201,138,.12),0 24px 70px rgba(244,166,192,.28);animation:float 6s ease-in-out infinite}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;border-radius:192px 192px 14px 14px;display:block}
@keyframes float{50%{transform:translateY(-8px)}}
.card{margin:34px auto 0;max-width:520px;padding:26px 26px 22px;border:1px solid rgba(232,201,138,.35);border-radius:18px;background:rgba(27,10,32,.55);backdrop-filter:blur(6px)}
#msg{margin:0;min-height:11.5em;font-size:17px;line-height:1.75;color:var(--blush);font-weight:300;text-align:left}
#msg.done{min-height:0}
.sig{margin:18px 0 0;padding-top:16px;border-top:1px solid rgba(232,201,138,.3);text-align:right;color:var(--soft);font-size:14px}
.sig b{display:block;font:italic 500 26px 'Playfair Display',Georgia,serif;color:var(--gold)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.row button{padding:11px 22px;border-radius:999px;border:1px solid var(--rose);background:rgba(244,166,192,.12);transition:background .25s}
.row button:hover{background:rgba(244,166,192,.28)}
@media (prefers-reduced-motion:reduce){#gift,.frame{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section id="intro">
<p>Специально для тебя</p>
<h2 class="serif">ЗАЙКИНА</h2>
<button id="gift" aria-label="Открыть подарок">
<svg viewBox="0 0 120 120" aria-hidden="true">
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset="1" stop-color="#d9568a"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dca0"/><stop offset="1" stop-color="#c9a24f"/></linearGradient></defs>
<rect x="20" y="58" width="80" height="54" rx="4" fill="url(#g1)"/>
<rect x="54" y="58" width="12" height="54" fill="url(#g2)"/>
<g class="lid"><rect x="14" y="40" width="92" height="20" rx="4" fill="url(#g1)"/><rect x="54" y="40" width="12" height="20" fill="url(#g2)"/>
<path d="M60 40C44 38 36 22 46 18c9-3 14 10 14 22Z" fill="url(#g2)"/><path d="M60 40C76 38 84 22 74 18c-9-3-14 10-14 22Z" fill="url(#g2)"/><circle cx="60" cy="40" r="5" fill="#c9a24f"/></g>
</svg>
<span>Открыть подарок</span>
</button>
<p class="from">От Хусейна Гавиша</p>
</section>

<script>
const $=id=>document.getElementById(id);
const c=$('fx'),x=c.getContext('2d');let W,H;const D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
const rnd=(a,b)=>a+Math.random()*(b-a);
const cols=['#ff9ec0','#ffd1e0','#e8c98a','#ffffff','#ff6f9f','#ffb86b','#c3a6ff'];
const SP=[],RK=[],FL=[];let live=false;

/* sound */
let A,M,on=true;
function ac(){if(!A){try{A=new(window.AudioContext||window.webkitAudioContext)();M=A.createGain();M.connect(A.destination)}catch(e){}}
if(A&&A.state==='suspended')A.resume();return A}
function pop(){if(!on||!ac())return;const n=A.sampleRate*.4,b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();f.type='lowpass';f.frequency.value=700+Math.random()*500;g.gain.value=.4;
s.buffer=b;s.connect(f);f.connect(g);g.connect(M);s.start()}
function tune(){if(!ac())return;const seq=[[7,.75],[7,.25],[9,1],[7,1],[12,1],[11,2],[7,.75],[7,.25],[9,1],[7,1],[14,1],[12,2],[7,.75],[7,.25],[19,1],[16,1],[12,1],[11,1],[9,1],[17,.75],[17,.25],[16,1],[12,1],[14,1],[12,2]];
let t=A.currentTime+.3;for(const [n,b] of seq){const o=A.createOscillator(),g=A.createGain(),d=b*.42;o.type='triangle';o.frequency.value=261.63*Math.pow(2,n/12);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(M);o.start(t);o.stop(t+d+.05);t+=d}}

/* fireworks */
function launch(tx,ty){RK.push({sx:rnd(W*.2,W*.8),tx,ty,p:0,x:0,y:H,c:cols[Math.random()*cols.length|0]})}
function boom(px,py,col){pop();const n=rnd(60,100)|0,ring=Math.random()<.4,k=rnd(2.2,4.2);
for(let i=0;i<n;i++){const a=i/n*6.283,s=ring?k:k*Math.random();SP.push({x:px,y:py,px,py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:rnd(.009,.018),c:Math.random()<.25?'#fff':col})}}
function salvo(n){for(let i=0;i<n;i++)setTimeout(()=>launch(rnd(W*.12,W*.88),rnd(H*.12,H*.5)),i*420)}
function confetti(n){for(let i=0;i<n;i++)FL.push({x:W/2,y:H*.6,vx:rnd(-7,7),vy:rnd(-13,-4),r:rnd(4,8),a:rnd(0,6),va:rnd(-.2,.2),c:cols[Math.random()*cols.length|0],t:1,g:.22,life:1})}
